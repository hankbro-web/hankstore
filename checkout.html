<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b12"><title>Checkout | HankStore</title><link rel="stylesheet" href="style.css"></head><body><header class="header"><div class="container nav"><a class="logo" href="index.html">Hank<span>Store</span></a><button class="menu-btn" onclick="toggleMenu()">☰</button><nav id="navbar"><a href="shop.html">Shop</a><a href="cart.html">Cart 🛒 <b id="cart-count">0</b></a><a href="login.html">Login</a></nav></div></header><main><section class="section"><div class="container"><div class="section-head"><div><p class="eyebrow">SECURE CHECKOUT</p><h1>Complete your order</h1></div></div><div class="checkout-grid"><form id="checkout-form" class="form-card form-stack"><div id="login-hint" class="notice">Checking login…</div><div class="two"><label>Full name<input id="name" class="input" required></label><label>Email<input id="email" class="input" type="email" required></label></div><div class="two"><label>Phone<input id="phone" class="input" required></label><label>Pincode<input id="pincode" class="input" inputmode="numeric" required></label></div><label>Address<textarea id="address" rows="4" required></textarea></label><label>City<input id="city" class="input" required></label><div><b>Payment</b><div class="radio-row" style="margin-top:9px"><label class="radio"><input type="radio" name="payment" value="cod" checked> Cash on Delivery</label><label class="radio"><input type="radio" name="payment" value="online"> Online (coming soon)</label></div></div><button class="btn" type="submit">Place Order →</button></form><aside class="form-card"><h2>Order summary</h2><div id="checkout-items"></div><hr style="border-color:#243148"><div class="summary-line"><b>Total</b><b id="checkout-total">₹0</b></div><p class="muted" style="font-size:12px">Your order will be saved securely in Firebase and appear in the admin dashboard in real time.</p></aside></div></div></section></main><div id="toast" class="toast"></div><script type="module" src="script.js"></script></body></html>
