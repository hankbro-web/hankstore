<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Delivery Login | HankStore</title><link rel="stylesheet" href="../style.css"></head><body><header class="header"><div class="container nav"><a class="logo" href="../index.html">Hank<span>Store</span> <small>DELIVERY</small></a></div></header><main class="auth-wrap"><div class="container"><div class="auth-card panel" style="margin:auto"><p class="eyebrow">DELIVERY PARTNER</p><h1>Delivery Boy Login</h1><form onsubmit="deliveryLogin(event)" class="form-stack"><label>Email<input id="delivery-login-email" class="input" type="email" required></label><label>Password<input id="delivery-login-password" class="input" type="password" required></label><button class="btn" type="submit">Login →</button></form><hr><h3>First time?</h3><p class="muted">Admin must add your email first.</p><form onsubmit="deliverySignup(event)" class="form-stack"><label>Email<input id="delivery-signup-email" class="input" type="email" required></label><label>Create password<input id="delivery-signup-password" class="input" type="password" minlength="6" required></label><button class="btn" type="submit">Create Delivery Account</button></form><p><a class="text-link" href="../index.html">← Back to Store</a></p></div></div></main><div id="toast" class="toast"></div><script type="module" src="../script.js"></script></body></html>
