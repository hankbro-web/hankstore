<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b12"><title>Login | HankStore</title><link rel="stylesheet" href="style.css"></head><body><header class="header"><div class="container nav"><a class="logo" href="index.html">Hank<span>Store</span></a><a class="btn secondary" href="index.html">← Store</a></div></header><main class="auth-wrap"><div class="container"><div class="auth-card panel" style="margin:auto"><p class="eyebrow">WELCOME BACK</p><h1 style="margin-top:0">HankStore account</h1><div class="auth-tabs"><button class="tab active" data-auth-tab="login" onclick="showAuthTab('login')">Login</button><button class="tab" data-auth-tab="signup" onclick="showAuthTab('signup')">Create account</button></div><div id="login-box"><form onsubmit="demoLogin(event)" class="form-stack"><label>Email<input class="input" type="email" required></label><label>Password<input class="input" type="password" required></label><button class="btn" type="submit">Login →</button></form></div><div id="signup-box" class="hide"><div class="form-stack"><label>Email<input id="signup-email" class="input" type="email" required></label><label>Password<input id="signup-password" class="input" type="password" minlength="6" required></label><button class="btn" onclick="createAccount()">Create Account →</button></div></div><p class="muted" style="font-size:12px;margin-bottom:0">Admin access is controlled separately by Firebase.</p></div></div></main><div id="toast" class="toast"></div><script type="module" src="script.js"></script></body></html>
